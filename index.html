<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Device Upgrade Binder</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 15px;
    background: #1a1a2e;
    color: #eee;
}
h1 { color: #88ccff; text-align: center; font-size: 22px; }
h3 { color: #ffcc44; margin: 10px 0 5px; }

.card {
    background: #16213e;
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
}

label { display: block; margin: 8px 0 4px; color: #aaa; font-size: 14px; }

input[type=text] {
    width: 100%;
    padding: 10px;
    border: 1px solid #444;
    border-radius: 4px;
    background: #0f3460;
    color: #fff;
    font-size: 15px;
}

button {
    background: #00cc66;
    color: #000;
    border: none;
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    margin: 5px 5px 5px 0;
    width: 100%;
}
button:hover { background: #00ff88; }
button:disabled { background: #555; color: #999; cursor: not-allowed; }
button.secondary { background: #ff8844; color: #fff; }
button.danger { background: #ff4444; color: #fff; }

#video { width: 100%; border-radius: 8px; background: #000; max-height: 400px; }
#canvas { display: none; }

.status {
    padding: 10px;
    border-radius: 4px;
    background: #0f3460;
    margin-top: 8px;
    font-size: 14px;
    word-break: break-all;
}
.ok { color: #44ff44; }
.err { color: #ff4444; }
.info { color: #ffcc44; }

.hex { font-family: monospace; word-break: break-all; color: #88ddff; }

.step-num {
    display: inline-block;
    width: 22px; height: 22px;
    background: #88ccff; color: #000;
    border-radius: 50%;
    text-align: center; line-height: 22px;
    font-weight: bold; margin-right: 5px;
}
</style>
</head>
<body>

<h1>Device Upgrade Binder</h1>

<div class='card'>
<h3><span class='step-num'>1</span>Tool Device ID</h3>
<label>Scan the QR on the ESP32 screen (press BOOT on the tool), or type the 16-hex ID:</label>
<input type='text' id='device_id' placeholder='e.g. 0000A1B2C3D4E5F6'>
<button onclick="startScan('device')" class='secondary' style='margin-top:8px;'>Scan Device ID QR</button>
</div>

<div class='card'>
<h3><span class='step-num'>2</span>Scan Ubilink QR Code</h3>
<video id='video' autoplay playsinline></video>
<canvas id='canvas'></canvas>
<button id='startScanBtn' onclick="startScan('ubilink')">Start Scan</button>
<button id='stopScanBtn' onclick='stopScan()' class='danger' style='display:none;'>Stop Scan</button>
<div id='scan_status' class='status'>Waiting to scan</div>
<label style='margin-top:8px;'>Or enter Ubilink ID manually (16 hex chars):</label>
<input type='text' id='manual_id' placeholder='e.g. 0308A7285EA480E7'>
<button onclick='useManualId()' class='secondary'>Use Manual ID</button>
</div>

<div class='card'>
<h3><span class='step-num'>3</span>Upload to Server</h3>
<p>Tool Device ID: <span id='show_dev' class='hex'>--</span></p>
<p>Ubilink ID: <span id='show_uid' class='hex'>--</span></p>
<button id='uploadBtn' onclick='uploadToServer()' disabled>Upload (bind)</button>
<div id='upload_status' class='status'>Waiting to upload</div>
<p style='color:#aaa;font-size:13px;'>The tool will fetch ID/KEY from the server automatically (key stays on the server), then write to the device.</p>
</div>

<!-- jsQR library -->
<script src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'></script>

<script>
// ============ Config ============
// 绑定接口：POST {ubilink_id, device_id}
const BIND_API = 'https://open-platform-prod.sylver-lining.com/device/upgrade';

// ============ State ============
let currentUid = null;
let videoStream = null;
let scanning = false;
let scanTarget = 'ubilink';   // 'device' 或 'ubilink'

// Pre-fill device_id from ?device= URL param (optional)
const params = new URLSearchParams(location.search);
if (params.get('device')) document.getElementById('device_id').value = params.get('device');

function normalizeHex16(s) {
    if (!s) return null;
    const clean = s.replace(/[\s:\-]/g, '').toUpperCase();
    return /^[0-9A-F]{16}$/.test(clean) ? clean : null;
}

function refreshShow() {
    const dev = normalizeHex16(document.getElementById('device_id').value);
    document.getElementById('show_dev').textContent = dev || '--';
    document.getElementById('show_uid').textContent = currentUid || '--';
    document.getElementById('uploadBtn').disabled = !(dev && currentUid);
}
document.getElementById('device_id').addEventListener('input', refreshShow);

// ============ Scan QR ============
async function startScan(target) {
    scanTarget = target || 'ubilink';
    const video = document.getElementById('video');
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        scanning = true;
        document.getElementById('startScanBtn').style.display = 'none';
        document.getElementById('stopScanBtn').style.display = 'block';
        document.getElementById('scan_status').textContent = 'Scanning...';
        document.getElementById('scan_status').className = 'status info';
        requestAnimationFrame(scanLoop);
    } catch (e) {
        document.getElementById('scan_status').textContent = 'Camera error: ' + e.message;
        document.getElementById('scan_status').className = 'status err';
    }
}

function stopScan() {
    scanning = false;
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
    document.getElementById('startScanBtn').style.display = 'block';
    document.getElementById('stopScanBtn').style.display = 'none';
}

function scanLoop() {
    if (!scanning) return;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) { onScanned(code.data); return; }
    }
    requestAnimationFrame(scanLoop);
}

function onScanned(data) {
    stopScan();
    const hex = normalizeHex16(data);
    if (!hex) {
        document.getElementById('scan_status').textContent = 'Got content but bad format: ' + data;
        document.getElementById('scan_status').className = 'status err';
        return;
    }
    if (scanTarget === 'device') {
        document.getElementById('device_id').value = hex;
        document.getElementById('scan_status').textContent = 'Device ID scanned: ' + hex;
        document.getElementById('scan_status').className = 'status ok';
        refreshShow();
    } else {
        setUid(hex);
    }
}

function setUid(uid) {
    currentUid = uid;
    document.getElementById('scan_status').textContent = 'Ubilink ID scanned: ' + uid;
    document.getElementById('scan_status').className = 'status ok';
    document.getElementById('upload_status').textContent = 'Waiting to upload';
    document.getElementById('upload_status').className = 'status';
    refreshShow();
}

function useManualId() {
    const uid = normalizeHex16(document.getElementById('manual_id').value);
    if (!uid) {
        document.getElementById('scan_status').textContent = 'Bad Ubilink ID (need 16 hex chars)';
        document.getElementById('scan_status').className = 'status err';
        return;
    }
    setUid(uid);
}

// ============ Upload (bind) ============
async function uploadToServer() {
    const dev = normalizeHex16(document.getElementById('device_id').value);
    if (!dev) { alert('Enter a valid 16-hex Tool Device ID'); return; }
    if (!currentUid) { alert('Scan or enter a Ubilink ID first'); return; }

    const el = document.getElementById('upload_status');
    el.textContent = 'Uploading...';
    el.className = 'status info';

    try {
        const resp = await fetch(BIND_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ubilink_id: currentUid, device_id: dev })
        });
        let json = {};
        try { json = await resp.json(); } catch (e) {}
        if (resp.ok && (json.code === 0 || json.code === undefined)) {
            el.innerHTML = '<b>Uploaded!</b><br>Tool <b>' + dev + '</b> will fetch and write ID/KEY automatically.';
            el.className = 'status ok';
        } else {
            el.textContent = 'Failed: HTTP ' + resp.status + ' ' + (json.msg || '');
            el.className = 'status err';
        }
    } catch (e) {
        el.textContent = 'Upload failed: ' + e.message;
        el.className = 'status err';
    }
}
</script>

</body>
</html>
